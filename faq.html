<!DOCTYPE html>
<html lang="it">
<head>
    <script>

        document.documentElement.style.visibility = 'hidden';
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FAQ | La Sinica</title>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&family=Playfair+Display:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0-beta3/css/all.min.css">
    <link rel="stylesheet" href="style.css">
</head>
<body>

<header>
    <div class="container nav-bar">
        <div class="logo">
            <h1>La Sinica</h1>
            <p>RISTORANTE · CUCINA FRIULANA</p>
        </div>
        <button class="mobile-menu-btn" id="mobileMenuBtn">☰</button>
        <ul class="nav-links" id="navLinks">
            <li><a href="index.html" data-i18n="nav_home">Home</a></li>
            <li><a href="Chi-siamo.html" data-i18n="nav_about">Chi Siamo</a></li>
            <li><a href="Contatti.html" data-i18n="nav_contacts">Contatti</a></li>
            <li><a href="Dove-siamo.html" data-i18n="nav_where">Dove Siamo</a></li>
            <li><a href="FAQ.html" data-i18n="nav_faq">FAQ</a></li>
        </ul>
        <div class="lang-switcher">
            <button class="lang-btn active" data-lang="it">IT</button>
            <button class="lang-btn" data-lang="en">EN</button>
            <button class="lang-btn" data-lang="de">DE</button>
            <button class="lang-btn" data-lang="fr">FR</button>
        </div>
    </div>
</header>

<main>
    <section class="page-section">
        <div class="container">
            <h2 class="section-title" data-i18n="faq_title">FAQ</h2>
            <p class="section-subtitle" data-i18n="faq_subtitle">Risposte alle domande più frequenti</p>
            <div class="faq-grid" id="faqContainer">
                <!-- Le FAQ vengono caricate dinamicamente da script.js -->
            </div>
        </div>
    </section>
</main>

<footer>
    <div class="container">
        <p>© 2025 La Sinica - Ristorante | <span data-i18n="footer_text">Cucina tipica friulana</span></p>
        <div class="social-icons">
            <a href="#"><i class="fab fa-facebook"></i></a>
            <a href="#"><i class="fab fa-instagram"></i></a>
            <a href="https://wa.me/393472618470"><i class="fab fa-whatsapp"></i></a>
        </div>
    </div>
</footer>

<script src="script.js"></script>
<style>
    .faq-question {
        cursor: pointer;
        display: flex;
        justify-content: space-between;
        align-items: center;
        padding: 12px 0;
        font-weight: 700;
        font-size: 1.1rem;
    }
    .faq-answer {
        display: none;
        padding: 10px 0 20px 0;
        color: #555;
        line-height: 1.6;
        border-bottom: 1px solid #e6d9ce;
    }
    .faq-answer.show {
        display: block;
    }
    .faq-item {
        margin-bottom: 5px;
    }
    .faq-icon {
        transition: transform 0.2s;
        font-size: 0.8rem;
    }
</style>
</body>
</html>
